<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f"><title>FlightWeather Global</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101e30;--line:#26384d;--text:#eaf2fb;--muted:#9fb1c6;--cyan:#42c8e8;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#0b1727;border-bottom:1px solid var(--line);position:relative;z-index:500}
.brand{font-weight:800;letter-spacing:.2px;font-size:16px}.brand span{color:var(--cyan)}.status{font-size:11px;color:var(--muted)}
main{height:calc(100dvh - 58px);position:relative}#map{height:100%;width:100%;background:#0b1727}
.panel{position:absolute;z-index:450;top:12px;left:12px;width:min(280px,calc(100vw - 24px));background:#0b1727ee;border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 8px 30px #0006;backdrop-filter:blur(10px)}
.panel h1{font-size:14px;margin:0 0 9px}.searchbox{display:flex;gap:6px;margin-bottom:10px}.searchbox input{min-width:0;flex:1;background:#07111f;border:1px solid #40566f;border-radius:8px;padding:9px;color:#fff;font-size:13px}.searchbox button{background:#12354a;border:1px solid #42c8e8;border-radius:8px;color:#fff;padding:0 11px;font-weight:700}.searchresults{display:none;max-height:145px;overflow:auto;margin:-3px 0 10px;border:1px solid #344b63;border-radius:8px;background:#07111f}.searchresults button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #26384d;background:transparent;color:#f4f8ff;font-size:12px}.searchresults button:last-child{border-bottom:0}.searchhint{font-size:11px;color:#b7c8d9;padding:8px 10px}.toggles{display:grid;gap:9px}.toggle{display:flex;align-items:center;gap:8px;color:#d9e5f2;font-size:13px}.toggle input{accent-color:var(--cyan);width:16px;height:16px}
.stats{display:flex;gap:14px;border-top:1px solid var(--line);margin-top:11px;padding-top:10px;color:var(--muted);font-size:12px}.stats b{color:var(--text);font-size:15px;display:block}
.notice{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.4}.notice.error{color:#ffb4a9}
.refresh{position:absolute;right:12px;top:12px;z-index:450;background:#0b1727ee;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-weight:650}
.aircraft-icon{background:transparent;border:0;color:#51d5f2;text-shadow:0 1px 5px #001;font-size:22px;line-height:24px;display:flex;align-items:center;justify-content:center}.aircraft-icon span{display:block;transform-origin:50% 50%;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1727!important;color:#f4f8ff!important;border:1px solid #42c8e8;box-shadow:0 8px 28px #000b!important}.leaflet-popup-content{margin:12px 14px!important;color:#f4f8ff!important;font-size:13px;line-height:1.45}.leaflet-popup-close-button{color:#fff!important;font-size:22px!important}.leaflet-control-attribution{font-size:9px!important}
.panel.compact{top:auto!important;bottom:8px!important;left:8px!important;width:min(210px,calc(100vw - 16px))!important;padding:7px 10px!important;transition:all .22s ease}.panel.compact h1,.panel.compact .searchbox,.panel.compact .searchresults,.panel.compact .toggles,.panel.compact .notice{display:none!important}.panel.compact .stats{border:0;margin:0;padding:0;gap:18px}.panel.compact .stats b{font-size:13px;display:inline;margin-right:4px}.panel.compact .stats div{font-size:10px;white-space:nowrap}\n@media(max-width:600px){.panel{top:auto;bottom:22px;width:calc(100vw - 24px)}.refresh{top:12px}.status{max-width:110px;text-align:right}}
</style></head>
<body>
<header><div class="brand">✈ <span>FlightWeather</span> Global</div><div class="status" id="topStatus">Mappa in inizializzazione…</div></header>
<main><div id="map"></div>
<section class="panel" aria-label="Controlli mappa">
<h1>Cerca volo o aeroporto</h1>
<div class="searchbox"><input id="searchInput" type="search" placeholder="Volo, registrazione, ICAO o aeroporto"><button id="searchBtn">Cerca</button></div>
<div class="searchresults" id="searchResults"></div>
<h1>Livelli mappa</h1>
<div class="toggles">
<label class="toggle"><input id="planesToggle" type="checkbox" checked> Traffico aereo live</label>
<label class="toggle"><input id="weatherToggle" type="checkbox"> Radar precipitazioni</label>
</div>
<div class="stats"><div><b id="planeCount">—</b>Aerei visibili</div><div><b id="radarTime">—</b>Ultimo radar</div></div>
<div class="notice" id="notice">Apri la mappa su una zona e attiva il traffico aereo. Gli aerei vengono caricati nell'area attorno al centro della vista.</div>
</section>
<button class="refresh" id="refreshBtn">↻ Aggiorna</button>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([45.7,9.7],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
let planeLayer=L.layerGroup().addTo(map),trailLayer=L.layerGroup().addTo(map),radarLayer=null,radarFrames=[];
const flightHistory=new Map();
let aircraftCache=[];
let pinnedAircraftKey=null;
const $=id=>document.getElementById(id);
function planeIcon(a){
 const angle=Number.isFinite(Number(a.track))?Number(a.track):0;
 const info=[a.t,a.desc,a.category,a.type].filter(Boolean).join(' ').toLowerCase();
 let shape='<path d="M16 1 L19 12 L30 20 L30 23 L18 19 L18 29 L23 32 L23 34 L16 31 L9 34 L9 32 L14 29 L14 19 L2 23 L2 20 L13 12 Z"/>';
 let fill='#ffd43b',stroke='#594300';
 if(/helicopter|elicottero|rotor|\\bheli\\b/.test(info)){
  fill='#35d6c5';stroke='#064b49';
  shape='<path d="M4 5 H28 M16 5 V11 M10 13 Q16 9 22 13 L24 18 H9 Q7 17 8 15 Z M22 15 L29 20 L28 22 L21 18 M11 18 L8 25 H10 L14 19 M16 5 V2 M2 27 H14"/>';
 }else if(/fighter|military|militare|caccia|\\bf-?\\d|\\beurofighter\\b|rafale|typhoon/.test(info)){
  fill='#ff6262';stroke='#641c27';
  shape='<path d="M16 1 L19 13 L30 23 L29 26 L18 21 L17 31 L22 34 L16 32 L10 34 L15 31 L14 21 L3 26 L2 23 L13 13 Z"/>';
 }else if(/glider|sailplane|aliante/.test(info)){
  fill='#a78bfa';stroke='#38256f';
  shape='<path d="M16 2 L18 15 L31 18 L31 20 L18 19 L18 29 L21 32 L16 31 L11 32 L14 29 L14 19 L1 20 L1 18 L14 15 Z"/>';
 }else if(/drone|uav|unmanned/.test(info)){
  fill='#f472b6';stroke='#6b214c';
  shape='<path d="M7 7 L12 12 M25 7 L20 12 M7 25 L12 20 M25 25 L20 20 M12 12 L20 20 M20 12 L12 20 M4 4 L10 4 L10 10 L4 10 Z M22 4 L28 4 L28 10 L22 10 Z M4 22 L10 22 L10 28 L4 28 Z M22 22 L28 22 L28 28 L22 28 Z M13 13 H19 V19 H13 Z"/>';
 }else if(/small|light|ultralight|piper|cessna|beech|cirrus|general aviation/.test(info)||/^a1|^a2|^b4/.test(String(a.category||'').toLowerCase())){
  fill='#68b7ff';stroke='#173f70';
  shape='<path d="M16 3 L18 13 L29 18 L29 20 L18 18 L18 27 L22 30 L16 29 L10 30 L14 27 L14 18 L3 20 L3 18 L14 13 Z M13 13 L16 10 L19 13"/>';
 }else if(/cargo|freighter|\\b\\d{2,3}f\\b/.test(info)){
  fill='#ffad42';stroke='#71400b';
  shape='<path d="M16 1 L19 12 L30 20 L30 23 L18 19 L18 29 L23 32 L23 34 L16 31 L9 34 L9 32 L14 29 L14 19 L2 23 L2 20 L13 12 Z M13 17 H19 V22 H13 Z"/>';
 }
 const svg='<svg viewBox="0 0 32 34" width="29" height="31" style="display:block;transform:rotate('+angle+'deg);transform-origin:50% 50%;filter:drop-shadow(0 1px 2px #001)"><g fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.15" stroke-linejoin="round">'+shape+'</g></svg>';
 return L.divIcon({className:'aircraft-icon',html:svg,iconSize:[32,34],iconAnchor:[16,17]})
}
function setNotice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}\nfunction setPanelCompact(compact){document.querySelector('.panel').classList.toggle('compact',compact)}
function niceAlt(v){if(v==='ground')return'A terra';const n=Number(v);return Number.isFinite(n)?Math.round(n*0.3048).toLocaleString('it-IT')+' m':'n/d'}
function niceSpeed(v){const n=Number(v);return Number.isFinite(n)?Math.round(n*1.852).toLocaleString('it-IT')+' km/h':'n/d'}
function niceVertical(v){const n=Number(v);return Number.isFinite(n)?(n>0?'+':'')+Math.round(n*0.3048).toLocaleString('it-IT')+' m/min':'n/d'}
function niceNumber(v,digits=1,suffix=''){const n=Number(v);return Number.isFinite(n)?n.toFixed(digits)+suffix:'n/d'}
function aircraftPopup(a){
 const row=(label,value)=>'<div style="display:flex;justify-content:space-between;gap:14px;padding:4px 0;border-bottom:1px solid #34465b"><span style="color:#9fb1c6">'+label+'</span><b style="text-align:right">'+escapeHtml(value??'n/d')+'</b></div>';
 const flight=String(a.flight||'').trim();
 const title=flight||a.hex||'Aeromobile';
 const rows=[
  row('Modello / tipo',a.t||a.desc||'n/d'),
  row('Costruttore / descrizione',a.desc||'n/d'),
  row('Registrazione',a.r||'n/d'),
  row('Identificativo ICAO',a.hex||'n/d'),
  row('Quota barometrica',niceAlt(a.alt_baro)),
  row('Quota geometrica',niceAlt(a.alt_geom)),
  row('Velocità al suolo',niceSpeed(a.gs)),
  row('Velocità verticale',niceVertical(a.baro_rate??a.geom_rate)),
  row('Rotta al suolo',Number.isFinite(Number(a.track))?Math.round(a.track)+'°':'n/d'),
  row('Prua magnetica',niceNumber(a.mag_heading,0,'°')),
  row('Codice transponder',a.squawk||'n/d'),
  row('Categoria aeromobile',a.category||'n/d'),
  row('Segnale ricevuto',niceNumber(a.rssi,1,' dBFS')),
  row('Ultimo rilevamento',Number.isFinite(Number(a.seen))?Math.round(a.seen)+' s fa':'n/d')
 ];
 return '<div style="min-width:225px;max-width:290px;color:#eaf2fb"><div style="font-size:16px;font-weight:800;margin-bottom:3px">'+escapeHtml(title)+'</div><div style="font-size:10px;color:#42c8e8;margin-bottom:8px">DATI AEROMOBILE · ADS-B</div>'+rows.join('')+'<div style="font-size:10px;color:#9fb1c6;margin-top:8px">Compagnia e destinazione non sono fornite dal normale flusso di posizione ADS-B.</div></div>';
}
async function loadPlanes(){
 if(!$('planesToggle').checked){planeLayer.clearLayers();$('planeCount').textContent='0';return}
 const c=map.getCenter(),radius=Math.min(250,Math.max(30,Math.round(map.getBounds().getNorthEast().distanceTo(map.getBounds().getSouthWest())/1852/2)));
 $('topStatus').textContent='Aggiornamento traffico…';
 try{
  const url='/api/aircraft?lat='+c.lat.toFixed(4)+'&lon='+c.lng.toFixed(4)+'&dist='+radius;
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('Servizio aerei: HTTP '+res.status);
  const data=await res.json(),aircraft=(data.aircraft||[]).filter(a=>Number.isFinite(a.lat)&&Number.isFinite(a.lon));
  aircraftCache=aircraft;
  let reopenKey=null;planeLayer.eachLayer(marker=>{if(marker.isPopupOpen()&&marker.options.aircraftKey)reopenKey=marker.options.aircraftKey});
  planeLayer.clearLayers();
  const now=Date.now();
  aircraft.forEach(a=>{
   const key=String(a.hex||a.flight||'').trim();
   if(key){
    let history=flightHistory.get(key)||[];
    const last=history[history.length-1];
    if(!last||Math.abs(last.lat-a.lat)+Math.abs(last.lon-a.lon)>0.00001)history.push({lat:a.lat,lon:a.lon,time:now});
    history=history.filter(p=>now-p.time<20*60*1000).slice(-40);
    flightHistory.set(key,history);
   }
   const marker=L.marker([a.lat,a.lon],{icon:planeIcon(a),aircraftKey:key});
   marker.bindPopup(aircraftPopup(a),{maxWidth:320,closeButton:true,autoPan:true});
   marker.addTo(planeLayer);
   marker.on('popupopen',()=>{pinnedAircraftKey=key;setPanelCompact(true)});\n   marker.on('popupclose',()=>{if(pinnedAircraftKey===key){pinnedAircraftKey=null;setPanelCompact(false)}});
   if(reopenKey&&key===reopenKey){marker.openPopup();pinnedAircraftKey=key;}
  });
  for(const [key,history] of flightHistory){if(!history.length||now-history[history.length-1].time>20*60*1000)flightHistory.delete(key)}
  trailLayer.clearLayers();
  flightHistory.forEach(history=>{if(history.length>1)L.polyline(history.map(p=>[p.lat,p.lon]),{color:'#42c8e8',weight:2,opacity:.68,dashArray:'5 6'}).addTo(trailLayer)});
  $('planeCount').textContent=aircraft.length.toLocaleString('it-IT');
  $('topStatus').textContent='Traffico aggiornato · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  setNotice(aircraft.length?'Ricevuti '+aircraft.length+' aeromobili entro circa '+Math.round(radius*1.852)+' km dal centro della mappa.':'Nessun aeromobile rilevato in quest’area. Prova a spostare o ingrandire la mappa.');
 }catch(e){$('topStatus').textContent='Traffico non disponibile';setNotice(e.message+' — Se il problema continua, riprova tra poco.',true)}
}
async function searchMap(){
 const q=$('searchInput').value.trim(),box=$('searchResults');
 if(!q)return;
 box.style.display='block';box.innerHTML='<div class="searchhint">Ricerca in corso…</div>';
 const matches=aircraftCache.filter(a=>[a.flight,a.hex,a.r,a.t].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase())));
 if(matches.length){
  box.innerHTML='';
  matches.slice(0,8).forEach(a=>{const b=document.createElement('button');b.textContent=(a.flight||a.hex||'Volo')+' · '+(a.r||a.t||'Aeromobile');b.onclick=()=>{map.setView([a.lat,a.lon],9);const m=planeLayer.getLayers().find(x=>x.options.aircraftKey===String(a.hex||a.flight||'').trim());if(m)m.openPopup();box.style.display='none'};box.appendChild(b)});
  return;
 }
 try{
  const query=/\\b(airport|aeroporto|aerodromo)\\b/i.test(q)?q:q+' airport';
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(query);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('Ricerca non disponibile');
  const results=await res.json();box.innerHTML='';
  if(!results.length){box.innerHTML='<div class="searchhint">Nessun risultato. Per i voli, cerca un identificativo presente nell’area caricata.</div>';return}
  results.forEach(place=>{const b=document.createElement('button');b.textContent=place.display_name;b.onclick=()=>{map.setView([Number(place.lat),Number(place.lon)],11);box.style.display='none';setNotice('Mappa centrata su '+place.display_name)};box.appendChild(b)});
 }catch(e){box.innerHTML='<div class="searchhint">Errore nella ricerca. Riprova.</div>'}
}
$('searchBtn').addEventListener('click',searchMap);
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchMap()});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadRadar(){
 try{
  const res=await fetch('https://api.rainviewer.com/public/weather-maps.json');
  if(!res.ok)throw new Error('Radar HTTP '+res.status);
  const data=await res.json();radarFrames=data.radar?.past||[];
  if(!radarFrames.length)throw new Error('Nessun fotogramma radar disponibile');
  const frame=radarFrames[radarFrames.length-1];
  if(radarLayer)map.removeLayer(radarLayer);
  radarLayer=L.tileLayer(data.host+frame.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:.62,maxZoom:7,attribution:'Radar: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>'});
  if($('weatherToggle').checked)radarLayer.addTo(map);
  $('radarTime').textContent=new Date(frame.time*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
 }catch(e){$('radarTime').textContent='N/D';setNotice('Radar meteo non disponibile: '+e.message,true)}
}
$('planesToggle').addEventListener('change',loadPlanes);
$('weatherToggle').addEventListener('change',e=>{if(!radarLayer){loadRadar();return}if(e.target.checked)radarLayer.addTo(map);else map.removeLayer(radarLayer)});
$('refreshBtn').addEventListener('click',()=>{loadPlanes();if($('weatherToggle').checked)loadRadar()});
let moveTimer;map.on('moveend',()=>{clearTimeout(moveTimer);moveTimer=setTimeout(loadPlanes,700)});
loadRadar();loadPlanes();
setInterval(()=>{if($('planesToggle').checked)loadPlanes()},30000);
setInterval(()=>{if($('weatherToggle').checked)loadRadar()},600000);
</script></body></html>
