<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f"><title>FlightWeather Global</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101e30;--line:#26384d;--text:#eaf2fb;--muted:#9fb1c6;--cyan:#42c8e8;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#0b1727;border-bottom:1px solid var(--line);position:relative;z-index:500}
.brand{font-weight:800;letter-spacing:.2px;font-size:16px}.brand span{color:var(--cyan)}.status{font-size:11px;color:var(--muted)}
main{height:calc(100dvh - 58px);position:relative}#map{height:100%;width:100%;background:#0b1727}
.panel{position:absolute;z-index:450;top:12px;left:12px;width:min(280px,calc(100vw - 24px));background:#0b1727ee;border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 8px 30px #0006;backdrop-filter:blur(10px)}
.panel h1{font-size:14px;margin:0 0 9px}.searchbox{display:flex;gap:6px;margin-bottom:10px}.searchbox input{min-width:0;flex:1;background:#07111f;border:1px solid #40566f;border-radius:8px;padding:9px;color:#fff;font-size:13px}.searchbox button{background:#12354a;border:1px solid #42c8e8;border-radius:8px;color:#fff;padding:0 11px;font-weight:700}.searchresults{display:none;max-height:145px;overflow:auto;margin:-3px 0 10px;border:1px solid #344b63;border-radius:8px;background:#07111f}.searchresults button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #26384d;background:transparent;color:#f4f8ff;font-size:12px}.searchresults button:last-child{border-bottom:0}.searchhint{font-size:11px;color:#b7c8d9;padding:8px 10px}.toggles{display:grid;gap:9px}.toggle{display:flex;align-items:center;gap:8px;color:#d9e5f2;font-size:13px}.toggle input{accent-color:var(--cyan);width:16px;height:16px}
.stats{display:flex;gap:14px;border-top:1px solid var(--line);margin-top:11px;padding-top:10px;color:var(--muted);font-size:12px}.stats b{color:var(--text);font-size:15px;display:block}
.notice{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.4}.notice.error{color:#ffb4a9}
.refresh{position:absolute;right:12px;top:12px;z-index:450;background:#0b1727ee;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-weight:650}
.locate{position:absolute;right:12px;top:62px;z-index:450;background:#0b1727ee;border:1px solid #42c8e8;border-radius:10px;padding:10px 12px;color:#eaf2fb;font-weight:750;box-shadow:0 3px 12px #0005}.locate:disabled{opacity:.6}
.aircraft-icon{background:transparent;border:0;color:#51d5f2;text-shadow:0 1px 5px #001;font-size:22px;line-height:24px;display:flex;align-items:center;justify-content:center}.aircraft-icon span{display:block;transform-origin:50% 50%;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1727!important;color:#f4f8ff!important;border:1px solid #42c8e8;box-shadow:0 8px 28px #000b!important}.leaflet-popup-content{margin:12px 14px!important;color:#f4f8ff!important;font-size:13px;line-height:1.45}.leaflet-popup-close-button{color:#fff!important;font-size:22px!important}.leaflet-control-attribution{font-size:9px!important}.aero-frequency-label{background:#fff!important;border:1px solid #7b3fc6!important;border-radius:4px!important;color:#39205e!important;font-size:10px!important;font-weight:800!important;padding:2px 4px!important;box-shadow:0 1px 4px #0005!important}
.panel-toggle{display:block;margin:0 0 9px auto;background:#12354a;border:1px solid #42c8e8;border-radius:8px;color:#eaf2fb;padding:6px 10px;font-size:12px;font-weight:750;cursor:pointer}.panel.compact{top:auto!important;bottom:8px!important;left:8px!important;width:min(230px,calc(100vw - 16px))!important;padding:7px 10px!important;transition:all .22s ease}.panel.compact h1,.panel.compact .searchbox,.panel.compact .searchresults,.panel.compact .toggles,.panel.compact .notice{display:none!important}.panel.compact .panel-toggle{margin:0 0 5px auto;padding:4px 8px;font-size:11px}.panel.compact .stats{border:0;margin:0;padding:0;gap:18px}.panel.compact .stats b{font-size:13px;display:inline;margin-right:4px}.panel.compact .stats div{font-size:10px;white-space:nowrap}
@media(max-width:600px){.panel{top:auto;bottom:22px;width:calc(100vw - 24px)}.refresh{top:12px}.status{max-width:110px;text-align:right}}
</style></head>
<body>
<header><div class="brand">✈ <span>FlightWeather</span> Global</div><div class="status" id="topStatus">Mappa in inizializzazione…</div></header>
<main><div id="map"></div>
<section class="panel" aria-label="Controlli mappa">
<button class="panel-toggle" id="panelToggle" type="button" aria-expanded="true">⌄ Riduci pannello</button>
<h1>Cerca volo o aeroporto</h1>
<div class="searchbox"><input id="searchInput" type="search" placeholder="Volo, registrazione, ICAO o aeroporto"><button id="searchBtn">Cerca</button></div>
<div class="searchresults" id="searchResults"></div>
<h1>Livelli mappa</h1>
<div class="toggles">
<label class="toggle"><input id="planesToggle" type="checkbox" checked> Traffico aereo live</label>
<label class="toggle"><input id="weatherToggle" type="checkbox"> Radar precipitazioni</label>
<label class="toggle"><input id="aeroToggle" type="checkbox"> Frequenze radio aeronautiche</label>
</div>
<div class="stats"><div><b id="planeCount">—</b>Aerei visibili</div><div><b id="radarTime">—</b>Ultimo radar</div></div>
<div class="notice" id="notice">Apri la mappa su una zona e attiva il traffico aereo. Gli aerei vengono caricati nell'area attorno al centro della vista.</div>
<div style="font-size:10px;color:#8fa4bb;margin-top:7px">Dati traffico ADS-B: <a href="https://adsb.fi/" target="_blank" rel="noopener noreferrer" style="color:#42c8e8">adsb.fi</a></div>
</section>
<button class="refresh" id="refreshBtn">↻ Aggiorna</button>
<button class="locate" id="locateBtn" title="Mostra la mia posizione GPS" aria-label="Mostra la mia posizione GPS">◎ GPS</button>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{worldCopyJump:true}).setView([45.7,9.7],5);
map.createPane('trailsPane');map.getPane('trailsPane').style.zIndex='550';map.getPane('trailsPane').style.pointerEvents='none';
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let planeLayer=L.layerGroup().addTo(map),trailLayer=L.layerGroup().addTo(map),radarLayer=null,radarFrames=[];
const aeronauticalLayer=L.layerGroup().addTo(map);
let aeronauticalRequest=null,aeronauticalTimer=null,lastAeroBounds='';
const flightHistory=new Map();
let aircraftCache=[];
let pinnedAircraftKey=null;
const $=id=>document.getElementById(id);
function planeIcon(a){
 const angle=Number.isFinite(Number(a.track))?Number(a.track):0;
 const info=[a.t,a.desc,a.category,a.type].filter(Boolean).join(' ').toLowerCase();
 let shape='<path d="M16 1 L19 12 L30 20 L30 23 L18 19 L18 29 L23 32 L23 34 L16 31 L9 34 L9 32 L14 29 L14 19 L2 23 L2 20 L13 12 Z"/>';
 let fill='#ffd43b',stroke='#594300';
 if(/helicopter|elicottero|rotor|\\bheli\\b/.test(info)){
  fill='#35d6c5';stroke='#064b49';
  shape='<path d="M4 5 H28 M16 5 V11 M10 13 Q16 9 22 13 L24 18 H9 Q7 17 8 15 Z M22 15 L29 20 L28 22 L21 18 M11 18 L8 25 H10 L14 19 M16 5 V2 M2 27 H14"/>';
 }else if(/fighter|military|militare|caccia|\\bf-?\\d|\\beurofighter\\b|rafale|typhoon/.test(info)){
  fill='#ff6262';stroke='#641c27';
  shape='<path d="M16 1 L19 13 L30 23 L29 26 L18 21 L17 31 L22 34 L16 32 L10 34 L15 31 L14 21 L3 26 L2 23 L13 13 Z"/>';
 }else if(/glider|sailplane|aliante/.test(info)){
  fill='#a78bfa';stroke='#38256f';
  shape='<path d="M16 2 L18 15 L31 18 L31 20 L18 19 L18 29 L21 32 L16 31 L11 32 L14 29 L14 19 L1 20 L1 18 L14 15 Z"/>';
 }else if(/drone|uav|unmanned/.test(info)){
  fill='#f472b6';stroke='#6b214c';
  shape='<path d="M7 7 L12 12 M25 7 L20 12 M7 25 L12 20 M25 25 L20 20 M12 12 L20 20 M20 12 L12 20 M4 4 L10 4 L10 10 L4 10 Z M22 4 L28 4 L28 10 L22 10 Z M4 22 L10 22 L10 28 L4 28 Z M22 22 L28 22 L28 28 L22 28 Z M13 13 H19 V19 H13 Z"/>';
 }else if(/small|light|ultralight|piper|cessna|beech|cirrus|general aviation/.test(info)||/^a1|^a2|^b4/.test(String(a.category||'').toLowerCase())){
  fill='#68b7ff';stroke='#173f70';
  shape='<path d="M16 3 L18 13 L29 18 L29 20 L18 18 L18 27 L22 30 L16 29 L10 30 L14 27 L14 18 L3 20 L3 18 L14 13 Z M13 13 L16 10 L19 13"/>';
 }else if(/cargo|freighter|\\b\\d{2,3}f\\b/.test(info)){
  fill='#ffad42';stroke='#71400b';
  shape='<path d="M16 1 L19 12 L30 20 L30 23 L18 19 L18 29 L23 32 L23 34 L16 31 L9 34 L9 32 L14 29 L14 19 L2 23 L2 20 L13 12 Z M13 17 H19 V22 H13 Z"/>';
 }
 const svg='<svg viewBox="0 0 32 34" width="29" height="31" style="display:block;flex:0 0 32px;transform:rotate('+angle+'deg);transform-origin:50% 50%;filter:drop-shadow(0 1px 2px #001)"><g fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.15" stroke-linejoin="round">'+shape+'</g></svg>';
 const airline=airlineForFlight(a.flight);
 const logo=airline?'<img src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(airline[2])+'&sz=64" alt="" title="'+escapeHtml(airline[1])+'" style="width:18px;height:18px;object-fit:contain;border:1px solid #fff9;border-radius:5px;background:#fff;padding:2px;box-shadow:0 1px 4px #000b" onerror="this.style.display=\'none\'">':'';
 const html='<div style="width:54px;height:34px;display:flex;align-items:center;gap:2px;overflow:visible">'+svg+logo+'</div>';
 return L.divIcon({className:'aircraft-icon',html,iconSize:[54,34],iconAnchor:[16,17]})
}
function setNotice(message,error=false){$('notice').textContent=message;$('notice').classList.toggle('error',error)}
function setPanelCompact(compact){const panel=document.querySelector('.panel');panel.classList.toggle('compact',compact);const button=$('panelToggle');if(button){button.textContent=compact?'⌃ Apri pannello':'⌄ Riduci pannello';button.setAttribute('aria-expanded',String(!compact))}}
function niceAlt(v){if(v==='ground')return'A terra';const n=Number(v);return Number.isFinite(n)?Math.round(n*0.3048).toLocaleString('it-IT')+' m':'n/d'}
function niceSpeed(v){const n=Number(v);return Number.isFinite(n)?Math.round(n*1.852).toLocaleString('it-IT')+' km/h':'n/d'}
function niceVertical(v){const n=Number(v);return Number.isFinite(n)?(n>0?'+':'')+Math.round(n*0.3048).toLocaleString('it-IT')+' m/min':'n/d'}
function niceNumber(v,digits=1,suffix=''){const n=Number(v);return Number.isFinite(n)?n.toFixed(digits)+suffix:'n/d'}
const airlinePrefixes=[
 ['RYR','Ryanair','ryanair.com'],['EIN','Aer Lingus','aerlingus.com'],['DLH','Lufthansa','lufthansa.com'],['EWG','Eurowings','eurowings.com'],['EJU','easyJet Europe','easyjet.com'],['EZY','easyJet','easyjet.com'],['ITY','ITA Airways','ita-airways.com'],['AZA','ITA Airways','ita-airways.com'],['WZZ','Wizz Air','wizzair.com'],['WMT','Wizz Air Malta','wizzair.com'],['AFR','Air France','airfrance.com'],['KLM','KLM','klm.com'],['BAW','British Airways','britishairways.com'],['UAE','Emirates','emirates.com'],['QTR','Qatar Airways','qatarairways.com'],['THY','Turkish Airlines','turkishairlines.com'],['SWR','Swiss','swiss.com'],['AUA','Austrian Airlines','austrian.com'],['VLG','Vueling','vueling.com'],['TAP','TAP Air Portugal','flytap.com'],['SAS','SAS','flysas.com'],['FIN','Finnair','finnair.com'],['LOT','LOT Polish Airlines','lot.com'],['AEE','Aegean Airlines','aegeanair.com'],['IBE','Iberia','iberia.com'],['TUI','TUI fly','tuifly.com'],['CFG','Condor','condor.com'],['TAR','Tunisair','tunisair.com'],['ETH','Ethiopian Airlines','ethiopianairlines.com'],['DAL','Delta Air Lines','delta.com'],['UAL','United Airlines','united.com'],['AAL','American Airlines','aa.com'],['ACA','Air Canada','aircanada.com'],['SIA','Singapore Airlines','singaporeair.com'],['CPA','Cathay Pacific','cathaypacific.com'],['JAL','Japan Airlines','jal.com'],['ANA','ANA','ana.co.jp']
];
function airlineForFlight(flight){
 const callsign=String(flight||'').trim().toUpperCase().replace(/\\s+/g,'');
 if(!callsign)return null;
 return airlinePrefixes.find(([prefix])=>callsign.startsWith(prefix))||null;
}
function aircraftPopup(a){
 const row=(label,value)=>'<div style="display:flex;justify-content:space-between;gap:14px;padding:4px 0;border-bottom:1px solid #34465b"><span style="color:#9fb1c6">'+label+'</span><b style="text-align:right">'+escapeHtml(value??'n/d')+'</b></div>';
 const flight=String(a.flight||'').trim();
 const title=flight||'Aeromobile';
 const airline=airlineForFlight(flight);
 const airlineHeader=airline?'<div style="display:flex;align-items:center;gap:9px;padding:7px 0 9px;margin-bottom:5px;border-bottom:1px solid #34465b"><img src="https://www.google.com/s2/favicons?domain='+encodeURIComponent(airline[2])+'&sz=128" alt="" style="width:34px;height:34px;object-fit:contain;border-radius:7px;background:#fff;padding:3px" onerror="this.style.display=\'none\'"><div><div style="font-weight:750;font-size:14px">'+escapeHtml(airline[1])+'</div><div style="font-size:10px;color:#9fb1c6">Compagnia identificata dal nominativo</div></div></div>':'';
 const rows=[
  row('Modello / tipo',a.t||a.desc||'n/d'),
  row('Registrazione',a.r||'n/d'),
  row('Quota barometrica',niceAlt(a.alt_baro)),
  row('Quota geometrica',niceAlt(a.alt_geom)),
  row('Velocità al suolo',niceSpeed(a.gs)),
  row('Velocità verticale',niceVertical(a.baro_rate??a.geom_rate)),
  row('Prua magnetica',niceNumber(a.mag_heading,0,'°')),
  row('Codice transponder',a.squawk||'n/d'),
  row('Ultimo rilevamento',Number.isFinite(Number(a.seen))?Math.round(a.seen)+' s fa':'n/d')
 ];
 return '<div style="min-width:225px;max-width:290px;color:#eaf2fb"><div style="font-size:16px;font-weight:800;margin-bottom:3px">'+escapeHtml(title)+'</div>'+airlineHeader+'<div style="font-size:10px;color:#42c8e8;margin-bottom:8px">DATI AEROMOBILE · ADS-B</div>'+rows.join('')+(!airline?'<div style="font-size:10px;color:#9fb1c6;margin-top:8px">Compagnia non identificabile dal nominativo disponibile.</div>':'')+'</div>';
}
async function loadPlanes(){
 if(!$('planesToggle').checked){planeLayer.clearLayers();$('planeCount').textContent='0';return}
 const c=map.getCenter(),radius=Math.min(250,Math.max(30,Math.round(map.getBounds().getNorthEast().distanceTo(map.getBounds().getSouthWest())/1852/2)));
 $('topStatus').textContent='Aggiornamento traffico…';
 try{
  const url='https://opendata.adsb.fi/api/v3/lat/'+c.lat.toFixed(4)+'/lon/'+c.lng.toFixed(4)+'/dist/'+radius;
  const res=await fetch(url,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('Servizio ADS-B: HTTP '+res.status);
  const data=await res.json(),aircraft=(data.ac||data.aircraft||[]).map(a=>({...a,seen:a.seen??a.seen_pos})).filter(a=>Number.isFinite(Number(a.lat))&&Number.isFinite(Number(a.lon)));
  aircraftCache=aircraft;
  let reopenKey=null;planeLayer.eachLayer(marker=>{if(marker.isPopupOpen()&&marker.options.aircraftKey)reopenKey=marker.options.aircraftKey});
  planeLayer.clearLayers();
  const now=Date.now();
  aircraft.forEach(a=>{
   const key=String(a.hex||a.flight||'').trim();
   if(key){
    let history=flightHistory.get(key)||[];
    const last=history[history.length-1];
    if(!last||Math.abs(last.lat-Number(a.lat))+Math.abs(last.lon-Number(a.lon))>0.000001)history.push({lat:Number(a.lat),lon:Number(a.lon),time:now});
    history=history.filter(p=>now-p.time<20*60*1000).slice(-40);
    flightHistory.set(key,history);
   }
   const marker=L.marker([a.lat,a.lon],{icon:planeIcon(a),aircraftKey:key});
   marker.bindPopup(aircraftPopup(a),{maxWidth:320,closeButton:true,autoPan:true});
   marker.addTo(planeLayer);
   marker.on('popupopen',()=>{pinnedAircraftKey=key;setPanelCompact(true)});
   marker.on('popupclose',()=>{if(pinnedAircraftKey===key){pinnedAircraftKey=null;setPanelCompact(false)}});
   if(reopenKey&&key===reopenKey){marker.openPopup();pinnedAircraftKey=key;}
  });
  for(const [key,history] of flightHistory){if(!history.length||now-history[history.length-1].time>20*60*1000)flightHistory.delete(key)}
  trailLayer.clearLayers();
  flightHistory.forEach(history=>{if(history.length>1){const path=history.map(p=>[p.lat,p.lon]);L.polyline(path,{pane:'trailsPane',color:'#48eaff',weight:3,opacity:.95,dashArray:'1 6',lineCap:'round',lineJoin:'round',interactive:false}).addTo(trailLayer)}});
  $('planeCount').textContent=aircraft.length.toLocaleString('it-IT');
  $('topStatus').textContent='Traffico aggiornato · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  setNotice(aircraft.length?'Ricevuti '+aircraft.length+' aeromobili entro circa '+Math.round(radius*1.852)+' km dal centro della mappa.':'Nessun aeromobile rilevato in quest’area. Prova a spostare o ingrandire la mappa.');
 }catch(e){$('topStatus').textContent='Traffico non disponibile';setNotice(e.message+' — Se il problema continua, riprova tra poco.',true)}
}
async function searchMap(){
 const q=$('searchInput').value.trim(),box=$('searchResults');
 if(!q)return;
 box.style.display='block';box.innerHTML='<div class="searchhint">Ricerca in corso…</div>';
 const matches=aircraftCache.filter(a=>[a.flight,a.hex,a.r,a.t].some(v=>String(v||'').toLowerCase().includes(q.toLowerCase())));
 if(matches.length){
  box.innerHTML='';
  matches.slice(0,8).forEach(a=>{const b=document.createElement('button');b.textContent=(a.flight||a.hex||'Volo')+' · '+(a.r||a.t||'Aeromobile');b.onclick=()=>{map.setView([a.lat,a.lon],9);const m=planeLayer.getLayers().find(x=>x.options.aircraftKey===String(a.hex||a.flight||'').trim());if(m)m.openPopup();box.style.display='none'};box.appendChild(b)});
  return;
 }
 try{
  const query=/\\b(airport|aeroporto|aerodromo)\\b/i.test(q)?q:q+' airport';
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q='+encodeURIComponent(query);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('Ricerca non disponibile');
  const results=await res.json();box.innerHTML='';
  if(!results.length){box.innerHTML='<div class="searchhint">Nessun risultato. Per i voli, cerca un identificativo presente nell’area caricata.</div>';return}
  results.forEach(place=>{const b=document.createElement('button');b.textContent=place.display_name;b.onclick=()=>{map.setView([Number(place.lat),Number(place.lon)],11);box.style.display='none';setNotice('Mappa centrata su '+place.display_name)};box.appendChild(b)});
 }catch(e){box.innerHTML='<div class="searchhint">Errore nella ricerca. Riprova.</div>'}
}
$('searchBtn').addEventListener('click',searchMap);
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchMap()});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function aeroIcon(kind){
 const symbol=kind==='airport'?'✈':kind==='nav'?'◉':'';
 const color=kind==='airport'?'#087fbd':kind==='nav'?'#7b3fc6':'#087fbd';
 return L.divIcon({className:'',html:'<div style="width:24px;height:24px;border:1.5px solid '+color+';border-radius:50%;background:#fff;color:'+color+';font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px #0008">'+symbol+'</div>',iconSize:[24,24],iconAnchor:[12,12]});
}
let radioFrequencyDataPromise=null;
function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i],next=text[i+1];
  if(quoted){if(ch==='"'&&next==='"'){field+='"';i++}else if(ch==='"')quoted=false;else field+=ch}
  else if(ch==='"')quoted=true;
  else if(ch===','){row.push(field);field=''}
  else if(ch==='\n'){row.push(field);rows.push(row);row=[];field=''}
  else if(ch!=='\r')field+=ch;
 }
 if(field.length||row.length){row.push(field);rows.push(row)}
 if(!rows.length)return[];
 const headers=rows.shift().map(x=>x.trim());
 return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])));
}
/* Archivio radio: struttura pronta per dati ufficiali AIP ENAV verificati.
   Finché il dataset ENAV non viene importato, viene usato OurAirports come riferimento preliminare;
   non è una fonte ufficiale né garantisce copertura o aggiornamento completi. */
const officialItalyRadioFrequencies=[]; // Formato previsto: {airport_ident,type,description,frequency_mhz,source,validity}
async function getRadioFrequencyData(){
 if(!radioFrequencyDataPromise){
  radioFrequencyDataPromise=(async()=>{
   const base='https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/';
   const urls=['airports.csv','airport-frequencies.csv'];
   const responses=await Promise.all(urls.map(async file=>{
    const response=await fetch(base+file,{cache:'force-cache'});
    if(!response.ok)throw new Error('Archivio frequenze non raggiungibile ('+file+', HTTP '+response.status+')');
    return parseCSV(await response.text());
   }));
   const [airports,frequencies]=responses;
   const airportByIdent=new Map(airports.map(a=>[a.ident,a]));
   return {frequencies,airportByIdent};
  })().catch(error=>{radioFrequencyDataPromise=null;throw error});
 }
 return radioFrequencyDataPromise;
}
function radioAirportMarker(lat,lon,airport,items){
 const icon=L.divIcon({className:'',html:'<div style="width:27px;height:27px;border:2px solid #087fbd;border-radius:50%;background:#fff;color:#087fbd;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px #0008">R</div>',iconSize:[27,27],iconAnchor:[13,13]});
 const lines=items.map(f=>{
  const type=String(f.type||'COM').toUpperCase();
  const description=f.description? ' — '+escapeHtml(f.description):'';
  return '<div style="display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #34465b"><span><b style="color:#42c8e8">'+escapeHtml(type)+'</b>'+description+'</span><b style="white-space:nowrap">'+Number(f.frequency_mhz).toFixed(3)+' MHz</b></div>';
 }).join('');
 const marker=L.marker([lat,lon],{icon});
 marker.bindPopup('<div style="min-width:245px;max-width:310px"><b>'+escapeHtml(airport.name||airport.ident||'Aeroporto')+' · '+escapeHtml(airport.ident||'')+'</b><div style="font-size:10px;color:#9fb1c6;margin:4px 0 7px">FREQUENZE RADIO AERONAUTICHE</div>'+lines+'</div>',{maxWidth:340});
 marker.bindTooltip('COM · '+items.length,{permanent:true,direction:'right',offset:[10,0],className:'aero-frequency-label'});
 marker.addTo(aeronauticalLayer);
}
async function loadAeronautical(){
 if(!$('aeroToggle').checked){aeronauticalLayer.clearLayers();lastAeroBounds='';return}
 if(map.getZoom()<5){aeronauticalLayer.clearLayers();lastAeroBounds='';setNotice('Ingrandisci la mappa almeno al livello 5 per visualizzare le frequenze radio.');return}
 const b=map.getBounds(),bbox=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(v=>v.toFixed(3)).join(',');
 if(bbox===lastAeroBounds&&aeronauticalLayer.getLayers().length)return;
 lastAeroBounds=bbox;aeronauticalLayer.clearLayers();
 setNotice('Caricamento frequenze radio aeronautiche…');
 try{
  const {frequencies,airportByIdent}=await getRadioFrequencyData();
  if(!$('aeroToggle').checked)return;
  const bounds=map.getBounds(),grouped=new Map();
  frequencies.forEach(f=>{
   const airport=airportByIdent.get(f.airport_ident);
   if(!airport)return;
   const lat=Number(airport.latitude_deg),lon=Number(airport.longitude_deg),mhz=Number(f.frequency_mhz);
   if(!Number.isFinite(lat)||!Number.isFinite(lon)||!Number.isFinite(mhz)||!bounds.contains([lat,lon]))return;
   const type=String(f.type||'').toUpperCase();
   if(/^(VOR|NDB|VOR-DME|VORTAC|NDB-DME|DME|TACAN)$/.test(type))return;
   const key=String(f.airport_ident||airport.id);
   if(!grouped.has(key))grouped.set(key,{airport,lat,lon,items:[]});
   grouped.get(key).items.push(f);
  });
  let count=0;
  grouped.forEach(group=>{group.items.sort((a,b)=>String(a.type).localeCompare(String(b.type)));radioAirportMarker(group.lat,group.lon,group.airport,group.items);count+=group.items.length});
  const airports=grouped.size;
  setNotice(count?'Caricate '+count+' frequenze su '+airports+' aeroporti. Tocca il simbolo blu per vedere TWR, GND, ATIS, APP, DEP e AFIS quando disponibili. Fonte attuale: archivio preliminare OurAirports, da verificare; non sostituisce l’AIP ENAV.':'Nessuna frequenza registrata nell’area visibile nell’archivio. Prova ad allargare la mappa.');
 }catch(e){
  lastAeroBounds='';
  setNotice('Archivio frequenze non disponibile: '+e.message+'. Controlla la connessione e riprova.',true);
 }
}
async function loadRadar(){
 try{
  const res=await fetch('https://api.rainviewer.com/public/weather-maps.json');
  if(!res.ok)throw new Error('Radar HTTP '+res.status);
  const data=await res.json();radarFrames=data.radar?.past||[];
  if(!radarFrames.length)throw new Error('Nessun fotogramma radar disponibile');
  const frame=radarFrames[radarFrames.length-1];
  if(radarLayer)map.removeLayer(radarLayer);
  radarLayer=L.tileLayer(data.host+frame.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:.62,maxZoom:7,attribution:'Radar: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>'});
  if($('weatherToggle').checked)radarLayer.addTo(map);
  $('radarTime').textContent=new Date(frame.time*1000).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
 }catch(e){$('radarTime').textContent='N/D';setNotice('Radar meteo non disponibile: '+e.message,true)}
}
$('panelToggle').addEventListener('click',()=>setPanelCompact(!document.querySelector('.panel').classList.contains('compact')));
$('planesToggle').addEventListener('change',loadPlanes);
$('weatherToggle').addEventListener('change',e=>{if(!radarLayer){loadRadar();return}if(e.target.checked)radarLayer.addTo(map);else map.removeLayer(radarLayer)});
$('aeroToggle').addEventListener('change',()=>{lastAeroBounds='';loadAeronautical()});
$('refreshBtn').addEventListener('click',()=>{loadPlanes();if($('weatherToggle').checked)loadRadar()});
let gpsMarker=null,gpsAccuracy=null;
$('locateBtn').addEventListener('click',()=>{
 if(!navigator.geolocation){setNotice('La geolocalizzazione non è supportata da questo browser.',true);return}
 const button=$('locateBtn');button.disabled=true;button.textContent='◎ Ricerca…';
 navigator.geolocation.getCurrentPosition(position=>{
  const lat=position.coords.latitude,lon=position.coords.longitude,accuracy=position.coords.accuracy;
  if(gpsMarker)map.removeLayer(gpsMarker);
  if(gpsAccuracy)map.removeLayer(gpsAccuracy);
  gpsAccuracy=L.circle([lat,lon],{radius:accuracy,color:'#1689ff',weight:1.5,fillColor:'#1689ff',fillOpacity:.12}).addTo(map);
  const gpsIcon=L.divIcon({className:'',html:'<div style="width:20px;height:20px;border:3px solid white;border-radius:50%;background:#1689ff;box-shadow:0 0 0 7px #1689ff44,0 1px 6px #0009"></div>',iconSize:[20,20],iconAnchor:[10,10]});
  gpsMarker=L.marker([lat,lon],{icon:gpsIcon,zIndexOffset:1000}).addTo(map).bindPopup('<b>La tua posizione GPS</b><br>Precisione stimata: '+Math.round(accuracy)+' m');
  map.setView([lat,lon],Math.max(map.getZoom(),12));
  gpsMarker.openPopup();
  setNotice('Posizione GPS individuata. Precisione stimata: circa '+Math.round(accuracy)+' metri.');
  button.disabled=false;button.textContent='◎ GPS';
 },error=>{
  const messages={1:'Permesso di posizione negato. Consenti la posizione nelle impostazioni del browser.',2:'Posizione GPS non disponibile. Controlla GPS e connessione.',3:'Ricerca posizione scaduta. Riprova.'};
  setNotice(messages[error.code]||'Impossibile ottenere la posizione GPS.',true);
  button.disabled=false;button.textContent='◎ GPS';
 },{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
});

let moveTimer;map.on('moveend',()=>{clearTimeout(moveTimer);moveTimer=setTimeout(()=>{loadPlanes();clearTimeout(aeronauticalTimer);if($('aeroToggle').checked)aeronauticalTimer=setTimeout(loadAeronautical,900)},700)});
loadRadar();loadPlanes();
setInterval(()=>{if($('planesToggle').checked)loadPlanes()},30000);
setInterval(()=>{if($('weatherToggle').checked)loadRadar()},600000);
</script></body></html>
