name: Aggiorna dati CTR italiani
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-ctr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scarica e filtra CTR OpenAIP Italia
        run: |
          mkdir -p data
          curl --fail --location --silent --show-error \
            'https://storage.openaip.net/openaip-system-exports/it_asp.geojson' \
            -o /tmp/it-asp.geojson
          python - <<'PY'
          import json
          with open('/tmp/it-asp.geojson', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('type') == 'FeatureCollection'
          ctr = [x for x in data.get('features', []) if str(x.get('properties', {}).get('type', '')).strip() == '4']
          assert ctr, 'Nessun CTR nel dataset'
          out = {'type': 'FeatureCollection', 'features': ctr}
          with open('data/ctr-it.geojson', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, separators=(',', ':'))
          print(f"Feature originali: {len(data['features'])}; CTR: {len(ctr)}; file filtrato: {__import__('os').path.getsize('data/ctr-it.geojson')} byte")
          PY
      - name: Pubblica archivio aggiornato
        run: |
          if [ -z "$(git status --porcelain -- data/ctr-it.geojson)" ]; then
            echo "Dati CTR già aggiornati"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ctr-it.geojson
          git commit -m "Ottimizza archivio CTR italiani"
          git push
