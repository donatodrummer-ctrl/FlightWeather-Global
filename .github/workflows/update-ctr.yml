name: Aggiorna dati CTR e aeroporti
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scarica e filtra CTR OpenAIP Italia
        run: |
          mkdir -p data
          curl --fail --location --silent --show-error \
            'https://storage.openaip.net/openaip-system-exports/it_asp.geojson' \
            -o /tmp/it-asp.geojson
          python - <<'PY'
          import json, os
          with open('/tmp/it-asp.geojson', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('type') == 'FeatureCollection'
          ctr = [x for x in data.get('features', []) if str(x.get('properties', {}).get('type', '')).strip() == '4']
          assert ctr, 'Nessun CTR nel dataset'
          with open('data/ctr-it.geojson', 'w', encoding='utf-8') as f:
              json.dump({'type':'FeatureCollection','features':ctr}, f, ensure_ascii=False, separators=(',', ':'))
          print(f"CTR: {len(ctr)}; file: {os.path.getsize('data/ctr-it.geojson')} byte")
          PY
      - name: Scarica e comprime aeroporti e campi di volo globali
        run: |
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv' \
            -o /tmp/airports.csv
          python - <<'PY'
          import csv, json, os, gzip
          points = []
          with open('/tmp/airports.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  kind = row.get('type', '')
                  if kind not in ('large_airport', 'medium_airport', 'small_airport'):
                      continue
                  try:
                      lat, lon = float(row['latitude_deg']), float(row['longitude_deg'])
                  except (ValueError, TypeError, KeyError):
                      continue
                  if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                      continue
                  points.append([lon,lat,kind,row.get('name',''),row.get('iso_country',''),row.get('municipality',''),row.get('icao_code',''),row.get('iata_code','')])
          assert points, 'Nessun aeroporto valido nel dataset OurAirports'
          raw = json.dumps(points, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          with open('data/airports.json', 'wb') as f:
              f.write(raw)
          with gzip.open('data/airports.json.gz', 'wb', compresslevel=9) as f:
              f.write(raw)
          print(f"Punti: {len(points)}; JSON: {len(raw)} byte; GZIP: {os.path.getsize('data/airports.json.gz')} byte")
          PY
      - name: Scarica e comprime piste aeroportuali globali
        run: |
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/runways.csv' \
            -o /tmp/runways.csv
          python - <<'PY'
          import csv, json, gzip, os
          rows = []
          with open('/tmp/runways.csv', newline='', encoding='utf-8') as f:
              for r in csv.DictReader(f):
                  if str(r.get('closed','0')).strip() == '1':
                      continue
                  try:
                      lat1, lon1 = float(r['le_latitude_deg']), float(r['le_longitude_deg'])
                      lat2, lon2 = float(r['he_latitude_deg']), float(r['he_longitude_deg'])
                  except (ValueError, TypeError, KeyError):
                      continue
                  if not (-90 <= lat1 <= 90 and -180 <= lon1 <= 180 and -90 <= lat2 <= 90 and -180 <= lon2 <= 180):
                      continue
                  rows.append([lat1, lon1, lat2, lon2, r.get('airport_ident',''), r.get('le_ident',''), r.get('he_ident',''), r.get('length_ft',''), r.get('width_ft',''), r.get('surface','')])
          assert rows, 'Nessuna pista valida nel dataset OurAirports'
          raw = json.dumps(rows, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          with open('data/runways.json', 'wb') as f:
              f.write(raw)
          with gzip.open('data/runways.json.gz', 'wb', compresslevel=9) as f:
              f.write(raw)
          print(f"Piste: {len(rows)}; JSON: {len(raw)} byte; GZIP: {os.path.getsize('data/runways.json.gz')} byte")
          PY
      - name: Pubblica archivi aggiornati
        run: |
          if [ -z "$(git status --porcelain -- data/ctr-it.geojson data/airports.json data/airports.json.gz data/runways.json data/runways.json.gz)" ]; then
            echo "Dati già aggiornati"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ctr-it.geojson data/airports.json data/airports.json.gz data/runways.json data/runways.json.gz
          git commit -m "Aggiorna CTR e dati aeroportuali compressi"
          git push
